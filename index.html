<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Teen Magazine has closed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #faf7f2;
    color: #2b2b2b;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    min-height: 100vh;
  }
  main {
    max-width: 34rem;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    font-weight: normal;
    letter-spacing: 0.01em;
    margin-bottom: 1.5rem;
    color: #1a1a1a;
  }
  .rule {
    width: 3rem;
    height: 2px;
    background: #c9a227;
    margin: 0 auto 1.5rem;
  }
  p {
    font-size: 1.05rem;
    line-height: 1.7;
    margin-bottom: 1rem;
    color: #444;
  }
  p.notice {
    font-size: 0.9rem;
    color: #777;
    font-style: italic;
    margin-top: 1.75rem;
  }
</style>
</head>
<body>
  <main>
    <h1>The Teen Magazine has closed.</h1>
    <div class="rule"></div>
    <p>After many wonderful years, we&rsquo;ve closed our doors. Thank you to every writer and reader who made this what it was.</p>
    <p class="notice">All site data will be permanently wiped in 30 days.</p>
  </main>
</body>
</html>
